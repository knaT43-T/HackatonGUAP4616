# Линтер бэкенда: запуск — `cd backend && ruff check .`
# Набор правил сознательно узкий: pyflakes (F — неиспользуемые импорты,
# переменные и т.п.), pycodestyle-ошибки (E4/E7/E9) и порядок импортов (I).
# B008 (Depends/File в аргументах по умолчанию) не включаем — это штатный
# стиль FastAPI.
target-version = "py311"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]
