# Прод-конфиг: отдаёт собранную статику (frontend/dist) и проксирует бэкенд.
# В docker-compose сейчас используется dev-сервер Vite, этот файл — заготовка
# для «настоящего» деплоя: npm run build → nginx.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: любой неизвестный путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Загруженные треки
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket: без Upgrade/Connection сокет не поднимется
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
